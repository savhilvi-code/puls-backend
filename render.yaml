services:
  - type: web
    name: puls-car-diagnostic-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        value: claude
      - key: CLAUDE_SEARCH_MODEL
        value: claude-haiku-4-5
      - key: OPENAI_SEARCH_MODEL
        value: gpt-4.1-mini
      - key: PARSER_API_URL
        sync: false
      - key: FRONTEND_API_URL
        value: /chat
